<header class="page-head">
  <p class="prompt"><span class="ps">$</span> grep -ri <span class="dim">"…"</span> posts/</p>

<p id="search-status" class="dim small" aria-live="polite">Type to search {{ collections.posts.size }} posts by title or category.</p>
<ol id="search-results" class="rows"></ol>
