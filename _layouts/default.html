<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
{% include "head.html" %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="/" aria-label="{{ site.name }}, home">evgeny<span class="acc">@</span>zborovsky<span class="dim">:~$</span></a>
    <nav aria-label="Main">
      <ul class="nav">
        <li><a href="/"{% if page.url == "/" or is_post %} aria-current="page"{% endif %}>./posts</a></li>
        <li><a href="/about/"{% if page.url == "/about/" %} aria-current="page"{% endif %}>./about</a></li>
        <li><a href="/archive/"{% if page.url == "/archive/" or page.url == "/categories/" %} aria-current="page"{% endif %}>./archive</a></li>
        <li><a href="/search/"{% if page.url == "/search/" %} aria-current="page"{% endif %}>grep</a></li>
      </ul>
    </nav>
  </div>
</header>
<main id="main" class="wrap">
{{ content }}
</main>
<footer class="foot">
  <div class="wrap foot-in">
    <span>© 2017–{{ "now" | date: "%Y" }} {{ site.author }} · content <a href="https://creativecommons.org/licenses/by-nc/4.0/" rel="license">CC BY-NC 4.0</a></span>
    <ul class="foot-links">
      {%- for l in site.links %}
      <li><a href="{{ l.url }}"{% if l.url contains "://" %} rel="me noopener"{% endif %} title="{{ l.title }}">{{ l.label }}</a></li>
      {%- endfor %}
    </ul>
  </div>
</footer>
<script src="/assets/js/site.js" defer></script>
</body>
</html>
